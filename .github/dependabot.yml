# Dependabot is free. It opens pull requests when a dependency or a pinned
# GitHub Action has a newer version, so the commit pins in the workflows do not
# go stale and a fix for a vulnerable package arrives as a reviewable change.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: development
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
