name: CI

on:
  push:
    branches: [main]
  pull_request:

# The token this workflow gets can read the repository and nothing else.
permissions:
  contents: read

# A newer push to the same branch replaces the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit: a tag can be moved to different code, a
      # commit cannot. Dependabot keeps the pins current (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `npm ci` installs exactly what the lockfile says. Install scripts are
      # off: no dependency needs one, so none gets to run code on the runner.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke test the built CLI on this repository
        run: node dist/bin.js scan . --no-audit --no-history --report html
      - name: Keep the smoke-test report
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foreman-report
          path: foreman-report/
          retention-days: 7

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Known vulnerabilities in what ships (commander, typescript)
        run: npm audit --omit=dev --audit-level=high
      - name: Registry signatures and provenance of every installed package
        run: npm audit signatures
      - name: Only the intended files are in the package
        run: npm run build && npm run check:pack
